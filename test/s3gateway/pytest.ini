[pytest]
addopts = -vv -ra --tb=short --html=bin/index.html --self-contained-html
markers =
    s3: S3 gateway Test Cases 
    acl: S3 gateway ACL Permission Test Cases
    object_lock: S3 gateway Object Locking feature Test Cases
    versioning: S3 gateway Versioning feature Test Cases
    multipartupload: S3 gateway Multi Part Upload Test Cases
    object_ownership: S3 gateway Object Ownership Test Cases
    tags: S3 gateway bucket/object tags Test Cases
    lifecycle: S3 gateway bucket lifecycle configuration Test Cases

